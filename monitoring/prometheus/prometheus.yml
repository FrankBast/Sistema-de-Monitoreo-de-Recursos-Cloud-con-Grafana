global:
  scrape_interval: 15s

alerting:
  alertmanagers:
  - static_configs:
    - targets: ['alertmanager:9093']

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # 1. Monitoreo del propio servidor de Observabilidad
  - job_name: 'ansd-observability-host'
    static_configs:
      - targets: ['node-exporter:9100']

  # 2. Monitoreo Din  mico (Instancias AWS desplegadas por Terraform)
  - job_name: 'ansd-aws-infrastructure'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets.json'
        refresh_interval: 1m

  # 3. Monitoreo de Disponibilidad Externa (SLA Portales)
  - job_name: 'ansd-public-portals'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://aws.portalweb.cc
          #    - https://tramites.gob.sv
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115